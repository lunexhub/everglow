<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Everglow - Login &amp; Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-background": "#1b1c1c",
                    "on-primary-fixed": "#201a1d",
                    "primary": "#655c5f",
                    "surface-container": "#f0eded",
                    "on-secondary-fixed": "#241a00",
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "error": "#ba1a1a",
                    "surface-container-low": "#f6f3f2",
                    "tertiary": "#745b00",
                    "inverse-surface": "#303030",
                    "surface-tint": "#655c5f",
                    "outline": "#7e7578",
                    "background": "#fcf9f8",
                    "surface-bright": "#fcf9f8",
                    "tertiary-fixed-dim": "#eac249",
                    "on-primary-container": "#776d70",
                    "on-tertiary-container": "#886c00",
                    "secondary-container": "#fed65b",
                    "secondary-fixed": "#ffe088",
                    "surface-container-high": "#eae7e7",
                    "on-secondary": "#ffffff",
                    "error-container": "#ffdad6",
                    "primary-container": "#fff1f5",
                    "inverse-on-surface": "#f3f0f0",
                    "on-surface": "#1b1c1c",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed-variant": "#4d4448",
                    "inverse-primary": "#d0c3c7",
                    "on-secondary-fixed-variant": "#574500",
                    "surface-container-highest": "#e4e2e1",
                    "tertiary-container": "#fff3dc",
                    "outline-variant": "#cfc4c7",
                    "on-primary": "#ffffff",
                    "secondary-fixed-dim": "#e9c349",
                    "on-error-container": "#93000a",
                    "primary-fixed": "#eddfe3",
                    "surface-dim": "#dcd9d9",
                    "on-tertiary-fixed-variant": "#584400",
                    "primary-fixed-dim": "#d0c3c7",
                    "tertiary-fixed": "#ffe08b",
                    "on-tertiary-fixed": "#241a00",
                    "surface": "#fcf9f8",
                    "surface-variant": "#e4e2e1",
                    "on-surface-variant": "#4c4548",
                    "secondary": "#735c00",
                    "on-secondary-container": "#745c00"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "xs": "8px",
                    "sm": "16px",
                    "base": "4px",
                    "gutter": "16px",
                    "lg": "32px",
                    "md": "24px",
                    "container-margin": "20px",
                    "xl": "48px"
            },
            "fontFamily": {
                    "label-caps": ["Inter"],
                    "display-lg": ["Playfair Display"],
                    "display-lg-mobile": ["Playfair Display"],
                    "body-sm": ["Inter"],
                    "headline-md": ["Playfair Display"],
                    "title-lg": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "display-lg-mobile": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "title-lg": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .gold-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #B8952E 100%);
        }
        .soft-glow:focus-within {
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }
        .tab-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .metallic-shadow {
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.08);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-primary-container min-h-screen flex flex-col items-center selection:bg-secondary-fixed">
<!-- Auth Shell -->
<main class="w-full max-w-md px-container-margin py-xl flex-grow flex flex-col items-center">
<!-- Logo & Branding -->
<header class="text-center mb-lg animate-fade-in">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-secondary italic mb-base">Everglow</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">
                Beauty in Every Glow, Clean in Every Home.
            </p>
</header>
<!-- Auth Card -->
<div class="w-full bg-surface-container-lowest rounded-xl border border-primary-container metallic-shadow overflow-hidden">
<!-- Tabs -->
<div class="flex border-b border-primary-container">
<button class="flex-1 py-md font-label-caps text-label-caps tab-transition text-secondary border-b-2 border-secondary bg-surface-container-low" id="tab-signin" onclick="switchTab('signin')">
                    SIGN IN
                </button>
<button class="flex-1 py-md font-label-caps text-label-caps tab-transition text-on-surface-variant border-b-2 border-transparent hover:text-secondary" id="tab-register" onclick="switchTab('register')">
                    REGISTER
                </button>
</div>
<!-- Content Area -->
<div class="p-lg">
<!-- Sign In Form -->
<form class="space-y-sm block" id="form-signin">
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-base">Email Address</label>
<div class="relative soft-glow">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-secondary focus:ring-0 font-body-md text-body-md text-on-surface outline-none transition-all" placeholder="you@example.com" type="email"/>
</div>
</div>
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-base">Password</label>
<div class="relative soft-glow">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-secondary focus:ring-0 font-body-md text-body-md text-on-surface outline-none transition-all" placeholder="••••••••" type="password"/>
</div>
<div class="flex justify-end">
<a class="font-label-caps text-label-caps text-secondary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
</div>
<button class="w-full gold-gradient py-md rounded-lg font-label-caps text-label-caps text-on-secondary-fixed uppercase tracking-wider font-bold shadow-md active:scale-95 transition-transform mt-md" type="submit">
                        Access Community
                    </button>
</form>
<!-- Register Form -->
<form class="space-y-sm hidden" id="form-register">
<div class="bg-primary-container p-sm rounded-lg mb-sm border border-secondary-fixed-dim">
<p class="font-body-sm text-body-sm text-on-secondary-fixed-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">info</span>
                            A once-off membership fee of <span class="font-bold">R100</span> applies.
                        </p>
</div>
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-base">Full Name</label>
<input class="w-full px-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-secondary focus:ring-0 font-body-md text-body-md text-on-surface outline-none transition-all" placeholder="Sarah Jenkins" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-sm">
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-base">Phone (SA)</label>
<input class="w-full px-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-secondary focus:ring-0 font-body-md text-body-md text-on-surface outline-none transition-all" placeholder="071 234 5678" type="tel"/>
</div>
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-base">Email</label>
<input class="w-full px-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-secondary focus:ring-0 font-body-md text-body-md text-on-surface outline-none transition-all" placeholder="sarah@glow.za" type="email"/>
</div>
</div>
<div class="space-y-base">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-base">Password</label>
<input class="w-full px-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-secondary focus:ring-0 font-body-md text-body-md text-on-surface outline-none transition-all" placeholder="Create a secure password" type="password"/>
</div>
<div class="space-y-base border-t border-primary-container pt-sm mt-sm">
<label class="font-label-caps text-label-caps text-secondary font-bold ml-base">Sponsor ID / Referral Link *</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-secondary">group_add</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-secondary rounded-lg focus:ring-0 font-body-md text-body-md text-on-surface outline-none transition-all placeholder:text-outline-variant" placeholder="E.g. GLOW-9921" required="" type="text"/>
</div>
<p class="text-[10px] text-on-surface-variant italic px-base">Mandatory for community verification.</p>
</div>
<button class="w-full gold-gradient py-md rounded-lg font-label-caps text-label-caps text-on-secondary-fixed uppercase tracking-wider font-bold shadow-md active:scale-95 transition-transform mt-md flex items-center justify-center gap-xs" type="submit">
                        Continue to Payment (R100)
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
</div>
</div>
<!-- Footer / Support -->
<footer class="mt-lg text-center space-y-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-60">
                Join thousands of South African entrepreneurs.
            </p>
<div class="flex justify-center gap-md">
<a class="font-label-caps text-label-caps text-secondary opacity-80 hover:opacity-100 transition-opacity" href="#">Terms of Success</a>
<a class="font-label-caps text-label-caps text-secondary opacity-80 hover:opacity-100 transition-opacity" href="#">Privacy Policy</a>
</div>
</footer>
</main>
<!-- Side Decoration (Ambient Visual) -->
<div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
<div class="absolute top-[-10%] right-[-5%] w-96 h-96 rounded-full bg-secondary-fixed opacity-10 blur-[100px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-96 h-96 rounded-full bg-secondary-fixed opacity-10 blur-[100px]"></div>
</div>
<script>
        function switchTab(type) {
            const btnSignIn = document.getElementById('tab-signin');
            const btnRegister = document.getElementById('tab-register');
            const formSignIn = document.getElementById('form-signin');
            const formRegister = document.getElementById('form-register');

            if (type === 'signin') {
                btnSignIn.classList.add('text-secondary', 'border-secondary', 'bg-surface-container-low');
                btnSignIn.classList.remove('text-on-surface-variant', 'border-transparent');
                
                btnRegister.classList.add('text-on-surface-variant', 'border-transparent');
                btnRegister.classList.remove('text-secondary', 'border-secondary', 'bg-surface-container-low');
                
                formSignIn.classList.remove('hidden');
                formSignIn.classList.add('block');
                formRegister.classList.add('hidden');
                formRegister.classList.remove('block');
            } else {
                btnRegister.classList.add('text-secondary', 'border-secondary', 'bg-surface-container-low');
                btnRegister.classList.remove('text-on-surface-variant', 'border-transparent');
                
                btnSignIn.classList.add('text-on-surface-variant', 'border-transparent');
                btnSignIn.classList.remove('text-secondary', 'border-secondary', 'bg-surface-container-low');
                
                formRegister.classList.remove('hidden');
                formRegister.classList.add('block');
                formSignIn.classList.add('hidden');
                formSignIn.classList.remove('block');
            }
        }

        // Simple subtle entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.metallic-shadow');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.6s cubic-bezier(0.23, 1, 0.32, 1)';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
