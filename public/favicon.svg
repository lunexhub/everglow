  <!-- Bottom Accent Jewels -->
  <circle cx="190" cy="400" r="10" fill="url(#roseGold)"/>
  <circle cx="256" cy="420" r="14" fill="url(#roseGold)"/>
  <circle cx="322" cy="400" r="10" fill="url(#roseGold)"/>
