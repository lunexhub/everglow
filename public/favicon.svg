  <path d="M 256 85 L 274 125 L 315 105 L 290 145 L 330 160 L 290 175 L 315 215 L 274 195 L 256 235 L 238 195 L 197 215 L 222 175 L 182 160 L 222 145 L 197 105 L 238 125 Z" fill="url(#roseGold)"/>

